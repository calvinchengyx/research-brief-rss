name: Research brief

on:
  # Run by hand from the Actions tab: preview (no email), test (email me only) or send.
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = no email, test = email Calvin only with a [TEST] subject, send = real email"
        type: choice
        options: [preview, test, send]
        default: preview
      kind:
        description: "brief = regular issue, dives = deep-dive email on new replies, both"
        type: choice
        options: [brief, dives, both]
        default: brief
      since:
        description: "Start date YYYY-MM-DD (optional, default: lookback_days ago)"
        required: false
  # Every pull request builds a preview issue and commits it to preview/ on the branch.
  pull_request:
  # Every morning: a deep-dive email if readers replied since the last one, and the
  # regular issue when send_every_days (settings.yaml) have passed.
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 CET / 08:00 CEST

permissions:
  contents: write

concurrency:
  group: brief-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build the brief
        env:
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode || 'preview' }}
          SINCE: ${{ inputs.since }}
          KIND: ${{ github.event_name == 'schedule' && 'both' || inputs.kind || 'brief' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: python -m brief --mode "$MODE" --kind "$KIND" ${SINCE:+--since "$SINCE"} ${SCHEDULED:+--scheduled}

      - name: Save preview, sent-articles state, archive and handled replies
        if: always()
        run: |
          git config user.name "research-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in preview state archive recipe.html inbox; do [ -e "$d" ] && git add -A -- "$d"; done
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Brief run ($MODE, $(date -u +%Y-%m-%d))"
          git pull --rebase   # replies may have landed in inbox/ during the run
          git push
        env:
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode || 'preview' }}
