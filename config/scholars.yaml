# Scholar list.
#
#   name:  the scholar's name
#   hint:  an institution, used to pick the right person when names are shared
#   topic: css | comm | cl -- where their papers go when not in a listed journal
#   type:  person (default)
#          coauthors   -> also follows people with >= min_joint_papers papers with them
#          group       -> also follows frequent coauthors at the same institution (lab members)
#          institution -> any paper with an author from `name` (filtered to social-science topics)
#   openalex: pin the exact OpenAlex author ID (A...) if the automatic match is wrong
#
# state/following.md lists who every entry was matched to, and every coauthor/group member.

scholars:
