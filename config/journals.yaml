# Journal and conference list.
#
#   name:   as the venue is called (matched against OpenAlex; add `issn` to pin it exactly)
#   topic:  css | comm | cl  (see topics.yaml)
#   filter: social-science   -> keep only papers on social-science topics (for broad venues)
#   kind:   journal (default) | conference
#   short:  shorter name shown in the email (e.g. PNAS)
#
# After each run, state/following.md lists what every name was matched to.

journals:
