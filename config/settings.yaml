# How often the brief goes out. The Monday cron checks every week and sends when
# this many days have passed since the last issue (14 = every other Monday).
send_every_days: 14

# How far back each run looks: the gap between issues plus a few days for
# indexing lag. Already-sent articles are never repeated, so overlap is safe.
lookback_days: 17

# Size limit (README section 6)
max_articles: 20
topic_priority: [css, comm, cl]
topic_quota:
  comm: {min: 3, max: 5}
  cl: {min: 3, max: 5}
scholar_watch: {max: 5}      # followed scholars' work outside the listed journals
overflow_footer: true        # "Also this week": cut articles as one-line links
overflow_max: 15             # longest that footer gets

abstract_words: 0            # words of abstract shown in the email; 0 = full abstract

# My research areas: used to rank papers and pick "Editor's picks".
research_interests:
  - online feminist discourse on Chinese social media platforms
  - LLM-based content coding and annotation for social science
  - gendered disinformation and narrative diffusion

# AI layer (README section 7)
ai:
  enabled: true              # without ANTHROPIC_API_KEY the keyword filter is used instead
  model: claude-haiku-5-5    # claude-sonnet-5-5 filters a little better at ~20x the cost
  effort: low
  batch_size: 20             # papers per request
  editors_picks: 4           # 3-5

# A note shown at the top of every issue sent on or before show_until (YYYY-MM-DD).
announcement:
  show_until: 2026-11-09
  title: "New: shape your own brief"
  text: >-
    Every paper in this issue now has a short ID, such as A1 or C3. If a paper catches
    your eye, reply to this email with its ID, up to three per reply (for example "A1, C3").
    The next morning you'll get a short email with a deep dive on the most requested papers,
    up to five: the research questions, the methods and the main findings, based on the full
    text when it is open access. Every paper you ask for also comes back in the next issue.
    Requests are anonymous: everyone gets the same deep dives, and nobody sees who asked for what.

# Deep dives on papers readers ask for by replying with their IDs. Each morning with new
# replies, the most voted papers get a deep-dive email (ties: Calvin's picks, then random).
deep_dive:
  max_per_reply: 3           # IDs counted per reply; one vote each
  max_papers: 5              # papers in a deep-dive email
  model: claude-sonnet-5-5   # reads the open-access PDF when there is one; about $0.10 a paper
  effort: medium

# Preprints (README "Preprints")
preprints:
  enabled: true
  topics: [css, cl]
  servers:                   # matched against OpenAlex repository names
    - arXiv
    - SSRN
    - PsyArXiv
    - SocArXiv
    - OSF Preprints

# Scholar groups ("coauthors" and "group" entries) are recomputed this often.
expand_every_days: 30
coauthor_years: 5

email:
  provider: brevo            # brevo | smtp
  sender_name: Calvin Research Brief
  subject: "Calvin Research Brief: {date}"
  dives_subject: "Calvin Research Brief: deep dives, {date}"   # keep "Calvin Research Brief" for the Gmail script
  # reply_to: someone@example.org   # where reader replies go (default: the sender address)

# Fallback filter when the AI layer is off: a paper from a `filter: social-science`
# venue is kept if its title or abstract contains one of these.
