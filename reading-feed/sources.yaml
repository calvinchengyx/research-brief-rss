      - {name: Sociological Methods & Research, url: "https://journals.sagepub.com/action/showFeed?ui=0&mi=ehikzz&ai=2b4&jc=smr&type=etoc&feed=rss", site: "https://journals.sagepub.com/home/smr", quality: 4, fit: 3, tags: [L], check: pattern}
      - {name: The China Quarterly, url: "https://www.cambridge.org/core/rss/product/id/37A7B629381F092FD873F9979093ABFC", site: "https://www.cambridge.org/core/journals/china-quarterly", quality: 5, fit: 3, tags: [F], check: page}
      - {name: Chinese Journal of Communication, url: "https://www.tandfonline.com/feed/rss/rcjc20", site: "https://www.tandfonline.com/toc/rcjc20/current", quality: 3, fit: 5, tags: [F], check: pattern}
      - {name: Journal of Contemporary China, url: "https://www.tandfonline.com/feed/rss/cjcc20", site: "https://www.tandfonline.com/toc/cjcc20/current", quality: 4, fit: 3, tags: [F], check: pattern}
      - {name: Asian Journal of Communication, url: "https://www.tandfonline.com/feed/rss/rajc20", site: "https://www.tandfonline.com/toc/rajc20/current", quality: 3, fit: 3, tags: [F], check: pattern}

  - id: preprints
    name: Preprint categories
    sources:
      - {name: "arXiv cs.SI (Social and Information Networks)", url: "https://rss.arxiv.org/rss/cs.SI", site: "https://arxiv.org/list/cs.SI/recent", quality: 3, fit: 5, tags: [D, F], check: ok,
         note: "Telegram, diffusion and platform studies appear here first. About 15-30 a day."}
      - {name: "arXiv cs.CY (Computers and Society)", url: "https://rss.arxiv.org/rss/cs.CY", site: "https://arxiv.org/list/cs.CY/recent", quality: 3, fit: 4, tags: [D, L, F], check: pattern}
      - {name: "arXiv cs.CL (Computation and Language)", url: "https://rss.arxiv.org/rss/cs.CL", site: "https://arxiv.org/list/cs.CL/recent", quality: 3, fit: 3, tags: [L], check: pattern,
         note: "100+ papers a day. Keep only with a keyword filter (social, annotation, gender, Chinese, stance)."}
      - {name: "arXiv physics.soc-ph (Physics and Society)", url: "https://rss.arxiv.org/rss/physics.soc-ph", site: "https://arxiv.org/list/physics.soc-ph/recent", quality: 3, fit: 3, tags: [D], check: pattern,
         note: "Lead-lag and contagion modelling."}

  - id: people
    name: Scholars (arXiv author feeds)
    intro: >-
      Google Scholar, OpenAlex and Semantic Scholar offer no RSS, so these follow each person's arXiv
      submissions through arXiv's Atom API. They miss journal-only work, which the weekly brief's
      scholar watch already covers. Common names can pull in namesakes.
    sources:
      - {name: Diyi Yang (Stanford), url: "https://export.arxiv.org/api/query?search_query=au:%22Diyi+Yang%22&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 5, fit: 5, tags: [L, F], check: pattern,
         note: "Computational social science NLP; already on my scholar list."}
      - {name: Petter Törnberg (Amsterdam), url: "https://export.arxiv.org/api/query?search_query=au:Tornberg_P&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 4, fit: 5, tags: [L, D], check: pattern,
         note: "New: LLM annotation of social media text, simulated platforms."}
      - {name: Fabrizio Gilardi (Zurich), url: "https://export.arxiv.org/api/query?search_query=au:Gilardi_F&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 4, fit: 5, tags: [L], check: pattern,
         note: "New: \"ChatGPT outperforms crowd workers\" line of LLM coding work."}
      - {name: Paul Röttger (Oxford / Bocconi), url: "https://export.arxiv.org/api/query?search_query=au:Rottger_P&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 4, fit: 4, tags: [L, F], check: pattern,
         note: "Hate speech and LLM values; already on my scholar list."}
      - {name: Kiran Garimella (Rutgers), url: "https://export.arxiv.org/api/query?search_query=au:Garimella_K&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 4, fit: 5, tags: [D], check: pattern,
         note: "New: messaging-app (WhatsApp, Telegram) misinformation."}
      - {name: Emilio Ferrara (USC), url: "https://export.arxiv.org/api/query?search_query=au:Ferrara_E&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 4, fit: 4, tags: [D], check: pattern,
         note: "New: influence operations and coordinated campaigns across platforms."}
      - {name: Savvas Zannettou (TU Delft), url: "https://export.arxiv.org/api/query?search_query=au:Zannettou_S&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 4, fit: 4, tags: [D], check: pattern,
         note: "New: fringe communities, cross-platform narrative spread, Telegram."}
      - {name: Mohsen Mosleh (Oxford), url: "https://export.arxiv.org/api/query?search_query=au:Mosleh_M&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 4, fit: 4, tags: [D], check: pattern}
      - {name: Scott A. Hale (Oxford), url: "https://export.arxiv.org/api/query?search_query=au:Hale_S_A&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 4, fit: 4, tags: [D, L], check: pattern,
         note: "Multilingual misinformation and LLMs."}
      - {name: Hannah Rose Kirk (Oxford), url: "https://export.arxiv.org/api/query?search_query=au:%22Hannah+Rose+Kirk%22&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 4, fit: 3, tags: [L], check: pattern}
      - {name: Kate Starbird (UW), url: "https://export.arxiv.org/api/query?search_query=au:Starbird_K&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 5, fit: 4, tags: [D], check: pattern,
         note: "Posts some, not all, of her work to arXiv."}
      - {name: David G. Rand (MIT), url: "https://export.arxiv.org/api/query?search_query=au:Rand_D_G&sortBy=submittedDate&sortOrder=descending&max_results=30", quality: 5, fit: 3, tags: [D], check: pattern,
         note: "Most of his work goes to PsyArXiv, so this catches only part of it."}
