# Curated reading feed: sources with RSS feed URLs.
#
# Build the page and the OPML file with:   python reading-feed/build.py
#
#   quality: 1-5   standing of the venue or person in its field
#   fit:     1-5   how close it sits to my current work
#   tags:    F = online feminism and Chinese platforms
#            L = corpus linguistics and LLM-based content coding
#            D = (gendered) disinformation, Telegram, narrative diffusion
#   check:   ok      feed fetched and parsed on 26 Oct 2026
#            page    URL copied from the publisher's own page for the venue
#            pattern publisher's standard feed address; the publisher blocks
#                    automated checks, so test it once in the reader
#   note:    why it is here, or how to keep it from flooding the reader
#
# Sections are listed in the order they appear on the page; within a section
# sources are ranked by quality + fit (ties go to quality).

sections:
  - id: css
    name: Computational social science and general science
    sources:
      - {name: Nature Human Behaviour, url: "https://www.nature.com/nathumbehav.rss", site: "https://www.nature.com/nathumbehav/", quality: 5, fit: 4, tags: [D, L], check: ok,
         note: "Top venue for large-scale behavioural and misinformation studies."}
      - {name: PNAS, url: "https://www.pnas.org/action/showFeed?type=etoc&feed=rss&jc=pnas", site: "https://www.pnas.org/", quality: 5, fit: 3, tags: [D, L], check: pattern,
         note: "Busy feed; skim the Social Sciences section only."}
      - {name: Science Advances, url: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=sciadv", site: "https://www.science.org/journal/sciadv", quality: 5, fit: 3, tags: [D], check: pattern,
         note: "Social and interdisciplinary sciences section carries a lot of CSS."}
      - {name: PNAS Nexus (advance articles), url: "https://academic.oup.com/rss/site_6448/advanceAccess_4114.xml", site: "https://academic.oup.com/pnasnexus", quality: 4, fit: 4, tags: [D, L], check: page,
         note: "Fast-growing home for misinformation and LLM-for-social-science papers."}
      - {name: Science, url: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science", site: "https://www.science.org/journal/science", quality: 5, fit: 2, tags: [D], check: pattern,
         note: "Very broad; keep for the few big social-media papers a year."}
      - {name: Nature, url: "https://www.nature.com/nature.rss", site: "https://www.nature.com/nature/", quality: 5, fit: 2, tags: [D], check: pattern,
         note: "Very broad; same Nature RSS format as Nature Human Behaviour."}
      - {name: Nature Communications, url: "https://www.nature.com/ncomms.rss", site: "https://www.nature.com/ncomms/", quality: 4, fit: 2, tags: [D], check: pattern,
         note: "Huge volume; consider a keyword filter in the reader."}
      - {name: Nature Computational Science, url: "https://www.nature.com/natcomputsci.rss", site: "https://www.nature.com/natcomputsci/", quality: 4, fit: 2, tags: [L], check: pattern}
      - {name: Communications Psychology, url: "https://www.nature.com/commspsychol.rss", site: "https://www.nature.com/commspsychol/", quality: 3, fit: 3, tags: [D], check: pattern}
      - {name: Journal of Computational Social Science, url: "https://link.springer.com/search.rss?facet-journal-id=42001", site: "https://link.springer.com/journal/42001", quality: 3, fit: 4, tags: [L, D], check: pattern}
      - {name: EPJ Data Science, url: "https://link.springer.com/search.rss?facet-journal-id=13688", site: "https://link.springer.com/journal/13688", quality: 4, fit: 4, tags: [D, L], check: pattern,
         note: "Network diffusion and platform data studies, including Telegram."}

  - id: comm
