         note: "Digital feminism, platform politics, disinformation."}
      - {name: New Media & Society, url: "https://journals.sagepub.com/action/showFeed?ui=0&mi=ehikzz&ai=2b4&jc=nms&type=etoc&feed=rss", site: "https://journals.sagepub.com/home/nms", quality: 5, fit: 4, tags: [F, D], check: pattern}
      - {name: Journal of Communication (advance articles), url: "https://academic.oup.com/rss/site_6088/advanceAccess_3963.xml", site: "https://academic.oup.com/joc", quality: 5, fit: 4, tags: [D, L], check: page}
      - {name: Political Communication, url: "https://www.tandfonline.com/feed/rss/upcp20", site: "https://www.tandfonline.com/toc/upcp20/current", quality: 5, fit: 4, tags: [D], check: pattern}
      - {name: Journal of Computer-Mediated Communication (advance articles), url: "https://academic.oup.com/rss/site_6096/advanceAccess_3967.xml", site: "https://academic.oup.com/jcmc", quality: 4, fit: 4, tags: [F, D], check: page}
      - {name: Social Media + Society, url: "https://journals.sagepub.com/action/showFeed?ui=0&mi=ehikzz&ai=2b4&jc=sms&type=etoc&feed=rss", site: "https://journals.sagepub.com/home/sms", quality: 4, fit: 4, tags: [F, D], check: page}
      - {name: Communication Methods and Measures, url: "https://www.tandfonline.com/feed/rss/hcms20", site: "https://www.tandfonline.com/toc/hcms20/current", quality: 4, fit: 4, tags: [L], check: pattern,
         note: "Where validation of automated and LLM coding gets published."}
      - {name: HKS Misinformation Review, url: "https://misinforeview.hks.harvard.edu/feed/", site: "https://misinforeview.hks.harvard.edu/", quality: 3, fit: 5, tags: [D], check: ok}
      - {name: Feminist Media Studies, url: "https://www.tandfonline.com/feed/rss/rfms20", site: "https://www.tandfonline.com/toc/rfms20/current", quality: 3, fit: 5, tags: [F], check: pattern}
      - {name: Big Data & Society, url: "https://journals.sagepub.com/action/showFeed?ui=0&mi=ehikzz&ai=2b4&jc=bds&type=etoc&feed=rss", site: "https://journals.sagepub.com/home/bds", quality: 4, fit: 3, tags: [L], check: pattern}
      - {name: "Journal of Quantitative Description: Digital Media", url: "https://journalqd.org/gateway/plugin/WebFeedGatewayPlugin/rss2", site: "https://journalqd.org/", quality: 3, fit: 4, tags: [D, F], check: ok,
         note: "Descriptive platform studies, often non-Western platforms."}
      - {name: Digital Journalism, url: "https://www.tandfonline.com/feed/rss/rdij20", site: "https://www.tandfonline.com/toc/rdij20/current", quality: 4, fit: 3, tags: [D], check: pattern}
      - {name: Communication Research, url: "https://journals.sagepub.com/action/showFeed?ui=0&mi=ehikzz&ai=2b4&jc=crx&type=etoc&feed=rss", site: "https://journals.sagepub.com/home/crx", quality: 4, fit: 3, tags: [D], check: pattern}
      - {name: Human Communication Research (advance articles), url: "https://academic.oup.com/rss/site_6092/advanceAccess_3965.xml", site: "https://academic.oup.com/hcr", quality: 4, fit: 3, tags: [D], check: page}
      - {name: The International Journal of Press/Politics, url: "https://journals.sagepub.com/action/showFeed?ui=0&mi=ehikzz&ai=2b4&jc=hij&type=etoc&feed=rss", site: "https://journals.sagepub.com/home/hij", quality: 4, fit: 3, tags: [D], check: pattern}
      - {name: "Media, Culture & Society", url: "https://journals.sagepub.com/action/showFeed?ui=0&mi=ehikzz&ai=2b4&jc=mcs&type=etoc&feed=rss", site: "https://journals.sagepub.com/home/mcs", quality: 4, fit: 3, tags: [F], check: pattern}
      - {name: Journal of Online Trust and Safety, url: "https://tsjournal.org/index.php/jots/gateway/plugin/WebFeedGatewayPlugin/rss2", site: "https://tsjournal.org/", quality: 3, fit: 3, tags: [D], check: ok}

  - id: cl
    name: NLP, computing and information science venues
    sources:
      - {name: ACL Anthology (all new papers), url: "https://aclanthology.org/papers/index.xml", site: "https://aclanthology.org/", quality: 5, fit: 4, tags: [L, F], check: ok,
         note: "Covers ACL, EMNLP, NAACL, Findings, TACL and Computational Linguistics in one feed. High volume when proceedings land; filter on keywords such as social, gender, Chinese, annotation."}
      - {name: ICWSM proceedings, url: "https://ojs.aaai.org/index.php/ICWSM/gateway/plugin/WebFeedGatewayPlugin/rss2", site: "https://ojs.aaai.org/index.php/ICWSM", quality: 4, fit: 5, tags: [D, F, L], check: ok,
         note: "The closest single venue to all three strands of my work."}
      - {name: Proceedings of the ACM on Human-Computer Interaction (CSCW), url: "https://dl.acm.org/action/showFeed?type=etoc&feed=rss&jc=pacmhci", site: "https://dl.acm.org/journal/pacmhci", quality: 4, fit: 4, tags: [F, D], check: pattern,
         note: "Also carries CHI-adjacent issues; skim titles."}
      - {name: Journal of the Association for Information Science and Technology, url: "https://asistdl.onlinelibrary.wiley.com/feed/23301643/most-recent", site: "https://asistdl.onlinelibrary.wiley.com/journal/23301643", quality: 4, fit: 2, tags: [L], check: pattern}
      - {name: Information Processing & Management, url: "https://rss.sciencedirect.com/publication/science/03064573", site: "https://www.sciencedirect.com/journal/information-processing-and-management", quality: 3, fit: 2, tags: [L], check: pattern}

  - id: area
    name: Political methodology, China and gender
    sources:
      - {name: Political Analysis, url: "https://www.cambridge.org/core/rss/product/id/EEF1D4438BAB8498B2A647F9DBC47AA7", site: "https://www.cambridge.org/core/journals/political-analysis", quality: 5, fit: 4, tags: [L], check: page,
         note: "Text-as-data methods, including LLM annotation validity."}
